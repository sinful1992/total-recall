[package]
name = "total-recall"
version = "1.6.3"
edition = "2021"
description = "Your complete Claude Code memory, browsable and free"
license = "MIT"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = { version = "0.26", features = ["axum"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
regex = "1"
indexmap = "2"
notify = "6"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
