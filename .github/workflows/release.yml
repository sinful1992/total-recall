name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # required by SignPath to verify GitHub Actions context

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libgtk-3-dev             libayatana-appindicator3-dev             libssl-dev             libxdo-dev             file             curl             wget

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles("**/Cargo.lock") }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.tar.gz
            target/release/bundle/appimage/*.AppImage.tar.gz.sig
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles("**/Cargo.lock") }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Save Tauri update signature
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-sig
          path: target/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn

      - name: Upload Windows installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*.exe

      - name: Sign with Authenticode (SignPath Foundation)
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        continue-on-error: true
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 9c9546ec-6473-46ab-b5d8-df84e220a253
          project-slug: total-recall
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial-configuration
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Overwrite with signed installer
        if: steps.signpath.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: signed/
          overwrite: true

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: artifacts/linux

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download Windows update signature
        uses: actions/download-artifact@v4
        with:
          name: windows-update-sig
          path: artifacts/windows
        continue-on-error: true

      - name: Generate latest.json
        run: |
          python3 << 'PYEOF'
          import json, glob, os
          from datetime import datetime, timezone

          tag = os.environ.get('GITHUB_REF_NAME', '')
          version = tag.lstrip('v')
          date = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          repo = 'sinful1992/total-recall'
          platforms = {}

          win_sigs = glob.glob('artifacts/windows/*.exe.sig')
          win_exes = glob.glob('artifacts/windows/*.exe')
          if win_sigs and win_exes:
              platforms['windows-x86_64'] = {
                  'signature': open(win_sigs[0]).read().strip(),
                  'url': 'https://github.com/' + repo + '/releases/download/' + tag + '/%s' % os.path.basename(win_exes[0]).replace(' ', '.')
              }

          lin_sigs = glob.glob('artifacts/linux/*.AppImage.tar.gz.sig')
          lin_tgzs = glob.glob('artifacts/linux/*.AppImage.tar.gz')
          if lin_sigs and lin_tgzs:
              platforms['linux-x86_64'] = {
                  'signature': open(lin_sigs[0]).read().strip(),
                  'url': 'https://github.com/' + repo + '/releases/download/' + tag + '/%s' % os.path.basename(lin_tgzs[0]).replace(' ', '.')
              }

          if platforms:
              manifest = {
                  'version': version,
                  'notes': 'https://github.com/' + repo + '/releases/tag/' + tag,
                  'pub_date': date,
                  'platforms': platforms
              }
              with open('latest.json', 'w') as f:
                  json.dump(manifest, f, indent=2)
              print('Generated latest.json:', list(platforms.keys()))
          else:
              print('No signed update artifacts found, skipping latest.json')
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/**/*.deb
            artifacts/linux/**/*.AppImage
            artifacts/linux/**/*.AppImage.tar.gz
            artifacts/linux/**/*.AppImage.tar.gz.sig
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.exe.sig
            latest.json
          generate_release_notes: true
