name: Generate Tauri Signing Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate keypair
        run: |
          echo "========================================="
          echo "  Copy the output below to GitHub Secrets"
          echo "========================================="
          cargo tauri signer generate -p ""
          echo ""
          echo "  TAURI_SIGNING_PRIVATE_KEY  = the 'Private:' line above"
          echo "  TAURI_SIGNING_PRIVATE_KEY_PASSWORD = (empty, no password set)"
          echo "  Public key goes in tauri.conf.json under plugins.updater.pubkey"
          echo "========================================="
